[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nope-honeypot"
version = "0.1.0"
description = "NOPE Observes Potential Enemies: honeypot-triggered intrusion response with nftables"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PyYAML>=6", "rich>=13"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
nope = "nope.cli:main"

[tool.setuptools]
packages = ["nope", "nope.decoys"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
