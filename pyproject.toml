[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nope-honeypot"
version = "0.1.0"
description = "NOPE Observes Potential Enemies: honeypot-triggered intrusion response with nftables"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PyYAML>=6", "rich>=13"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
nope = "nope.cli:main"

[tool.setuptools]
packages = ["nope", "nope.decoys"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import sorting, UP modern syntax, B likely bugs
select = ["E", "W", "F", "I", "UP", "B"]
